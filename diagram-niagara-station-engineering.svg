<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><title>A supportable station</title><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#867392" stroke-opacity=".07"/></pattern></defs><rect width="1200" height="720" fill="#e9e5df"/><rect width="1200" height="720" fill="url(#grid)"/><g font-family="Arial,sans-serif"><text x="58" y="77" font-size="13" fill="#766780" letter-spacing="2">BITDASH / ENGINEERING NOTES</text><text x="58" y="145" font-size="42" fill="#302a39">A supportable station</text><text x="58" y="183" font-size="13" fill="#887791" letter-spacing="1.5">DEVICE / EQUIPMENT / OPERATOR</text><rect x="58" y="245" width="330" height="220" rx="14" fill="#faf8f4" stroke="#b8acbf"/><circle cx="90" cy="280" r="13" fill="#756386"/><text x="90" y="285" text-anchor="middle" fill="white" font-size="12">1</text><text x="82" y="326" font-size="13" letter-spacing="1.2" fill="#766780">INTEGRATION LAYER</text><text x="82" y="365" font-size="18" fill="#302a39">Drivers + proxy points</text><text x="82" y="409" font-size="14" fill="#6a6072">Confirm version and licensing</text><path d="M388 355h52m-9-7 9 7-9 7" fill="none" stroke="#806c91" stroke-width="2"/><rect x="440" y="245" width="330" height="220" rx="14" fill="#e1daeb" stroke="#b8acbf"/><circle cx="472" cy="280" r="13" fill="#756386"/><text x="472" y="285" text-anchor="middle" fill="white" font-size="12">2</text><text x="464" y="326" font-size="13" letter-spacing="1.2" fill="#766780">EQUIPMENT MODEL</text><text x="464" y="365" font-size="18" fill="#302a39">Names • units • schedules</text><text x="464" y="409" font-size="14" fill="#6a6072">Apply consistent conventions</text><path d="M770 355h52m-9-7 9 7-9 7" fill="none" stroke="#806c91" stroke-width="2"/><rect x="822" y="245" width="330" height="220" rx="14" fill="#faf8f4" stroke="#b8acbf"/><circle cx="854" cy="280" r="13" fill="#756386"/><text x="854" y="285" text-anchor="middle" fill="white" font-size="12">3</text><text x="846" y="326" font-size="13" letter-spacing="1.2" fill="#766780">OPERATOR LAYER</text><text x="846" y="365" font-size="18" fill="#302a39">Graphics • alarms • histories</text><text x="846" y="409" font-size="14" fill="#6a6072">Validate navigation and access</text><path d="M58 535h1084" stroke="#b8acbf"/><text x="58" y="582" font-size="18" fill="#62546f">Keep source points, equipment behavior and presentation traceable.</text><text x="58" y="659" font-size="11" fill="#8b7d93" letter-spacing="1.5">ILLUSTRATIVE ENGINEERING DIAGRAM / NOT A PROJECT RECORD</text></g></svg>